
name: tokenus

services:
  tokenus-app:
    container_name: tokenus-app
    image: tokenus-app-image
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    build:
      context: ../..
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8081:8080"
    env_file:
      - ../../.env
    depends_on:
      tokenus-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tokenus_shared_network

  tokenus-mysql:
    image: mysql:latest
    container_name: tokenus-mysql
    env_file:
      - ../../.env
    ports:
      - "3307:3306"
    volumes:
      - db_volume:/var/lib/mysql
    restart: always
    networks:
      - tokenus_shared_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 5
      start_period: 10s

volumes:
  db_volume:

networks:
  tokenus_shared_network:
    external: true