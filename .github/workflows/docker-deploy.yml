name: Build and Push Docker Image to ECR and Deploy on EC2

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set execute permission for gradlew
        run: chmod +x gradlew

      - name: 4.Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 5.Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 6.Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ./gradlew jib \
            -Djib.to.image=$ECR_REGISTRY/$ECR_REPOSITORY \
            -Djib.to.tags=$IMAGE_TAG,latest

      - name: 7.Delete old Docker images (keep latest 5)
        env:
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          aws ecr list-images \
            --region $AWS_REGION \
            --repository-name $ECR_REPOSITORY \
            --query 'imageIds[*]' \
            --output json \
            | jq '.[:-5]' \
            > old-images.json

          IMAGE_COUNT=$(jq length old-images.json)
          if [ "$IMAGE_COUNT" -gt 0 ]; then
            aws ecr batch-delete-image \
              --region $AWS_REGION \
              --repository-name $ECR_REPOSITORY \
              --image-ids file://old-images.json
            echo "Deleted $IMAGE_COUNT old images."
          else
            echo "No images to delete."
          fi

  run-images-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 8. Connect to EC2 and run deployment script
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd deploy-script
            chmod +x deploy.sh
            ./deploy.sh
