name: Build and Push Docker Image to ECR and Deploy on EC2

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1.리포지토리 가져오기
        uses: actions/checkout@v4

      - name: 2.JDK 17 설치
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3.Gradle 명령 실행 권한 설정
        run: chmod +x gradlew

      - name: 4.Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: 5.Amazon ECR에 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 6.Docker Image 빌드 및 ECR에 push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ./gradlew jib \
            -Djib.to.image=$ECR_REGISTRY/$ECR_REPOSITORY \
            -Djib.to.tags=$IMAGE_TAG,latest

      - name: 7.오래된 Docker 이미지 삭제 (최신 5개 제외)
        env:
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          aws ecr list-images \
            --region $AWS_REGION \
            --repository-name $ECR_REPOSITORY \
            --query 'imageIds[*]' \
            --output json \
            | jq '.[:-5]' \
            > old-images.json

          IMAGE_COUNT=$(jq length old-images.json)
          if [ "$IMAGE_COUNT" -gt 0 ]; then
            aws ecr batch-delete-image \
              --region $AWS_REGION \
              --repository-name $ECR_REPOSITORY \
              --image-ids file://old-images.json
            echo "🧹 $IMAGE_COUNT개의 오래된 이미지를 삭제했습니다."
          else
            echo "🧼 삭제할 이미지가 없습니다."
          fi

  run-images-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 8.EC2 접속 및 배포 스크립트 실행
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd deploy-script
            sh ./deploy.sh
